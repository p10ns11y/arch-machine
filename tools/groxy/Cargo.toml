[package]
name = "groxy"
version = "0.1.0"
edition = "2021"
description = "XChat DM remote control satellite (Eagle loop) for arch-machine — binary: groxy"
license = "MIT"
publish = false

[[bin]]
name = "groxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
