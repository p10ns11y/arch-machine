# arch-machine ontology graph
# Verified 2026-07-22 against tools/archy jobs + modules/security/install.sh
meta:
  version: "1.1"
  project: arch-machine
  last_updated: "2026-07-22"
  mission: >
    Interconnected friction-removing automations: Eagle routes offline jobs;
    profiles/modules install; evidence closes the remediation loop.

nodes:
  - id: am:ControlPlane
    type: Domain
    name: Control Plane
    subgraph: control
    fused_summary: >
      archy is the live sentinel. Keys/job lines become Msg; Eagle updates;
      Cmds hit satellites/shell. Gum TEA and tinfoil are legacy bridges.
    source_refs:
      - tools/archy/
      - docs/archy.md
      - .agents/skills/eagle-satellite-elomaxz/SKILL.md

  - id: am:EagleTEA
    type: Concept
    name: Eagle TEA Message Passing
    subgraph: control
    fused_summary: >
      Model/Msg/Update/Cmd/View. Eagle stays thin; satellites own domain jobs;
      jobs run offline (start → stream → exit).
    source_refs:
      - tools/archy/src/eagle.rs
      - tools/archy/src/jobs.rs
      - tools/archy/src/satellites/mod.rs
      - .agents/skills/eagle-satellite-elomaxz/references/machine-graph.md

  - id: am:ProfileEngine
    type: Domain
    name: Profile Engine
    subgraph: install
    fused_summary: >
      install.sh + lib/installer.sh compose YAML profiles with --thin,
      --validate, --dry-run before mutate. archy InstallDry invokes this.
    source_refs:
      - install.sh
      - lib/installer.sh
      - config/profiles/
      - tools/archy/src/jobs.rs

  - id: am:ModuleBay
    type: Domain
    name: Module Bay
    subgraph: install
    fused_summary: >
      modules/*/install.sh expose install_<name>() for profile composition.
      Security module also has a standalone --agent-expand that installs keeper.
    source_refs:
      - modules/
      - docs/MODULES.md
      - modules/security/install.sh

  - id: am:EvidenceLoop
    type: Domain
    name: Evidence Loop
    subgraph: evidence
    fused_summary: >
      Most archy satellites run maintenance/*.sh (inventory, audit, catalog,
      actuate, evidence extract). Bundles land in logs/.
    source_refs:
      - lib/evidence.sh
      - maintenance/extract-evidence.sh
      - maintenance/inventory.sh
      - maintenance/security-audit.sh
      - tools/archy/src/jobs.rs
      - logs/

  - id: am:RemediationPolicy
    type: Boundary
    name: Security Remediation Policy
    subgraph: evidence
    fused_summary: >
      policies/security-remediation.md is never-compress. Dry-run before apply.
      No silent destructive maintenance.
    source_refs:
      - policies/security-remediation.md
      - maintenance/apply-remediation.sh

  - id: am:Groxy
    type: Domain
    name: Groxy Remote Surface
    subgraph: remote
    fused_summary: >
      inject notify + acp serve only. No ambient XChat → open TUI.
    source_refs:
      - tools/groxy/
      - docs/groxy.md
      - bin/groxy

  - id: am:PluginCycle
    type: Concept
    name: Grok Plugin Cycle
    subgraph: remote
    fused_summary: >
      Plugin slash cmds hit host; archy co-pilot LaunchGrok with preload.
      Slash only — never hand users am-* scripts.
    source_refs:
      - docs/archy.md
      - docs/INDEX.md
      - tools/archy/src/grok_launch.rs

  - id: am:Keeper
    type: Domain
    name: Keeper Threshold Vault
    subgraph: vault
    fused_summary: >
      First-class product at tools/keeper. Installed by security module
      --agent-expand (build release → ~/.local/bin/keeper), or via profile
      path install_security when security.full is composed. Not ProfileEngine.
    source_refs:
      - tools/keeper/
      - tools/keeper/README.md
      - modules/security/install.sh
      - arch-design/keeper.md
      - arch-design/coming-next-keeper.md

  - id: am:VerifyGate
    type: Domain
    name: Verify Gate
    subgraph: verify
    fused_summary: >
      make lint, validate-profiles, cargo tests (archy/groxy/keeper), go vet,
      install --thin --validate, evidence dry-run.
    source_refs:
      - AGENTS.md
      - .github/workflows/ci.yml
      - Makefile

edges:
  - from: am:ControlPlane
    to: am:EagleTEA
    rel: implements
  - from: am:EagleTEA
    to: am:EvidenceLoop
    rel: dispatches_jobs
    note: >
      FireSatellite → maintenance/*.sh (inventory, catalog, audit, actuate,
      omarchy-status, extract-evidence). See tools/archy/src/jobs.rs.
  - from: am:EagleTEA
    to: am:ProfileEngine
    rel: install_dry
    note: >
      SatelliteId::InstallDry → bash install.sh --profile … --dry-run.
  - from: am:EagleTEA
    to: am:Groxy
    rel: may_launch
    note: Cmd::LaunchGrok / co-pilot path.
  - from: am:PluginCycle
    to: am:EagleTEA
    rel: cycles_with
  - from: am:ProfileEngine
    to: am:ModuleBay
    rel: composes
    note: Profile includes[] → install_<module>() sourced by installer.
  - from: am:ModuleBay
    to: am:Keeper
    rel: agent_expand_installs
    note: >
      modules/security/install.sh --agent-expand builds tools/keeper and
      installs ~/.local/bin/keeper. Standalone; NOT via ProfileEngine.
  - from: am:ModuleBay
    to: am:Keeper
    rel: profile_may_install
    note: >
      install_security() when profile category=full and security enabled
      (e.g. security-dev). Separate from --agent-expand entry.
  - from: am:EvidenceLoop
    to: am:RemediationPolicy
    rel: governed_by
  - from: am:VerifyGate
    to: am:ControlPlane
    rel: gates
  - from: am:VerifyGate
    to: am:ProfileEngine
    rel: gates
  - from: am:VerifyGate
    to: am:EvidenceLoop
    rel: gates
  - from: am:VerifyGate
    to: am:Keeper
    rel: gates
    note: cargo test --manifest-path tools/keeper/Cargo.toml
