# Generated for arch-machine — edit when verify commands change.
# Prefer cockpit.yaml; keep this aligned with tmux-layout.sh for agents that read legacy manifests.
project: arch-machine
risk_profile: medium
layout: golden-4
phi_major: 62
phi_minor: 38

panes:
  - id: watch-lint
    title: WATCH
    tier: watch
    priority: 1
    space_profile: scroll
    cwd: .
    command: 'while true; do make lint 2>&1 | tail -40; sleep 30; done'
    value: shellcheck/yamllint/markdownlint drift

  - id: console
    title: CMD
    tier: monitor
    priority: 2
    space_profile: interactive
    value: agent_scan, manual verify

  - id: git
    title: GIT
    tier: monitor
    priority: 3
    space_profile: tui-side
    command: lazygit
    tool: lazygit
    value: Review agent diffs

  - id: verify-suite
    title: VERIFY
    tier: verify
    priority: 4
    space_profile: confirm-burst
    cwd: .
    command: 'make lint && make validate-profiles && cargo test --manifest-path tools/archy/Cargo.toml && cargo test --manifest-path tools/groxy/Cargo.toml && cargo test --manifest-path tools/keeper/Cargo.toml && go build -o /tmp/tinfoil ./bin/tinfoil.go && go vet ./cmd/... ./bin/... && ./maintenance/extract-evidence.sh --dry-run'
    value: Pre-PR gate from AGENTS.md (omit install.sh --thin --validate — use at listed test)
