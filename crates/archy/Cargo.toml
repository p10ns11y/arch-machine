[package]
name = "archy"
version = "0.1.0"
edition = "2021"
description = "Ratatui control plane for arch-machine — entry, loop, shell/Go backends, Grok dock"
license = "MIT"
publish = false

[[bin]]
name = "archy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
