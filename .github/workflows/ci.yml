name: CI (Vigilant Guardian)

on:
  push:
    branches: [ sentinel, 'hotfix/**', 'feature/**' ]
  pull_request:
    branches: [ sentinel ]
  workflow_dispatch:

concurrency:
  group: vigilant-guardian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One checkout for soft-fail linters — avoids 429 bursts when many jobs
  # download actions/checkout in parallel (2026-08-17 infra flake).
  guardian-soft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0

      - name: shellcheck (excluding legacy)
        run: |
          find . -name '*.sh' -not -path './.grok/*' -not -path './logs/*' -not -path './systemd/*' \
            | xargs shellcheck --severity=warning || true

      - name: yamllint (config + profiles)
        run: |
          pip install yamllint -q
          yamllint -c .yamllint.yml config/ || true

      - name: markdownlint (relaxed for humor/docs)
        run: |
          npm install -g markdownlint-cli 2>/dev/null || true
          markdownlint '**/*.md' --ignore 'FUNREADME.md' --ignore 'node_modules' || true

      - name: Profile validation harness (stub — exercises yaml + module symbols)
        run: |
          echo "Phase 4 harness: would validate every profile includes[] has matching install_<module> and module dir"
          ./install.sh --profile minimal --dry-run --validate 2>/dev/null || echo "Validation stub (full harness in next iteration)"

      - name: Evidence bundle smoke test
        run: |
          ./maintenance/extract-evidence.sh --dry-run 2>/dev/null || echo "Evidence smoke (uses sample logs/)"
          ls -l logs/evidence-bundle-*.json 2>/dev/null | tail -1 || echo "No bundle in this run (expected in real env)"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.22'

      - name: Go build + vet (tinfoil + TUI)
        run: |
          go build -o /tmp/tinfoil ./bin/tinfoil.go || true
          go vet ./cmd/... ./bin/... 2>/dev/null || true

  # SN-EC-2 + Fusion Surplus: eye-comfort schedule tests + SoT drift check
  eye-comfort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0
      - name: Schedule unit tests
        run: make eye-comfort-test
      - name: Generated package SoT check
        run: make eye-comfort-generate-check

  # Keeper threshold vault — crypto regressions must not be silent
  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (tools/keeper)
        run: cargo test --manifest-path tools/keeper/Cargo.toml

  # archy control plane — TEA / Grok preload / audit dry-run smoke
  archy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (tools/archy)
        run: make archy-test

  # groxy satellite — inject/ACP policy + packages (SN-GROXY-2)
  # Host-only test resolve_grok_binary_finds_real_executable skips when grok is absent.
  groxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (tools/groxy)
        run: make groxy-test
