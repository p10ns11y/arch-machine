name: "security-dev"
description: "Security-focused development setup with Kubernetes hardening"
version: "1.0.0"

includes:
  - system.full
  - development.full
  - security.full

excludes: []

customizations:
  system:
    rocm: false
  development:
    mise:
      versions:
        python: ["3.12", "3.13", "3.14"]
        node: ["22", "lts"]
        rust: ["stable"]
  ml_ai: false
  security:
    # Use this for now devplays/cilium-teragon-clusters.sh
    # Need advanced tweaks for local laptops
    # Current configs are better for on-perm/cloud
    # With microservices
    kubernetes:
      k3s: false
    cilium: false
    tetragon: false
    encrypted_storage: true