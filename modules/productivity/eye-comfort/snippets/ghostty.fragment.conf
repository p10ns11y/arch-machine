# Eye-comfort Ghostty host prefs — palette comes from Omarchy theme include.
# Typeset (product): one monospace family, fixed size, breathing cell height.
# Merge into ~/.config/ghostty/config after: config-file = …/theme/ghostty.conf
#
# Hierarchy (fixed rem-like steps for terminals — not fluid clamp):
#   body / code … size 10
#   cell air ……… adjust-cell-height +3 (~1.15× optical leading)
#   weight ……… Regular only (bold via SGR, not a second family)

font-family = "JetBrainsMono Nerd Font"
font-size = 10
font-style = Regular
font-feature = +liga
font-feature = +calt
adjust-cell-height = 3
background-opacity = 0.96
