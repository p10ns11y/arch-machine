# Eye-comfort host prefs — palette comes from Omarchy theme include.
# Append or merge into ~/.config/ghostty/config after config-file = theme ghostty.conf
font-family = "JetBrainsMono Nerd Font"
font-size = 10
font-style = Regular
font-feature = +liga
font-feature = +calt
adjust-cell-height = 3
background-opacity = 0.96
